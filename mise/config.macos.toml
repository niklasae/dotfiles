# :schema https://mise.en.dev/schema/mise.json
[bootstrap.packages]
"brew-cask:kitty" = "latest"
# "brew-cask:karabiner-elements" = "latest"
# "brew-cask:raycast"            = "latest"
"brew-cask:1password" = "latest"
"brew-cask:1password-cli" = "latest"

[bootstrap.macos.defaults]
"com.apple.dock" = { autohide = true, tilesize = 40 }
"NSGlobalDomain" = { KeyRepeat = 2, InitialKeyRepeat = 15 }

[bootstrap.macos.defaults.screensaver]
askForPassword = 1
askForPasswordDelay = 0

[bootstrap.macos.finder]
preferred_view_style = "column"
show_extensions_warning = false
show_pathbar = true
show_status_bar = true
show_all_files = true

